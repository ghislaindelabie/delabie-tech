  - slug: florence-intermodal-2022
    date: 2022-05-02
    type: talk
    role: speaker
    source: "10th Florence Intermodal Forum"
    original_url: "https://fsr.eui.eu/event/10th-florence-intermodal-forum-towards-eu-wide-intermodal-ticketing/"
    tags: [MaaS, standards, EU, ticketing]
    projects: [maas-standards]
    detail: true
    en:
      title: "Towards an aggiornamento of European standardisation in MDMS"
      excerpt: "Talk at the 10th Florence Intermodal Forum (EC / DG MOVE / Florence School of Regulation) on the renewal of European Multimodal Distribution and Mobility Services standardisation."
    fr:
      title: "Vers un aggiornamento de la standardisation européenne en MDMS"
      excerpt: "Intervention au 10e Florence Intermodal Forum (CE / DG MOVE / Florence School of Regulation) sur le renouvellement de la standardisation européenne MDMS (Multimodal Distribution and Mobility Services)."
    body_en: |
      ## Context

      The 10th Florence Intermodal Forum was the European Commission / DG MOVE
      annual gathering hosted by the Florence School of Regulation, focused
      that year on the prospects for EU-wide intermodal ticketing. The room
      was a mix of regulators, infrastructure managers, mobility operators,
      and standards-body representatives.

      ## What I argued

      The European MDMS (Multimodal Distribution and Mobility Services)
      standardisation framework was approaching the moment where the gap
      between the regulatory ambition (a continent-wide, accessible,
      interoperable mobility service layer) and the on-the-ground
      implementation (fragmented local stacks, brittle bilateral agreements,
      under-specified interfaces) needed an explicit *aggiornamento* — a
      deliberate refresh of the technical, contractual and governance
      conventions, not yet another patch.

      ## Why it matters here

      The Florence audience is the room where European mobility-data policy
      is rehearsed before it lands in regulation. Bringing the
      Fabrique des Mobilités' work on MaaS standards (CMS, OCSS, Mon Compte
      Mobilité) into that conversation is part of what the **MaaS standards**
      project is for. The talk frames the rationale for the work catalogued
      in the linked case study.
    body_fr: |
      ## Contexte

      Le 10e Florence Intermodal Forum était la rencontre annuelle organisée
      par la Commission européenne / DG MOVE et hébergée par la Florence
      School of Regulation, consacrée cette année-là aux perspectives d'une
      billettique intermodale à l'échelle de l'UE. La salle réunissait
      régulateurs, gestionnaires d'infrastructure, opérateurs de mobilité et
      représentants des organismes de normalisation.

      ## Ce que j'ai défendu

      Le cadre de standardisation européen MDMS (Multimodal Distribution and
      Mobility Services) approchait du moment où l'écart entre l'ambition
      réglementaire (une couche de services de mobilité interopérable,
      accessible, à l'échelle du continent) et la réalité de terrain (stacks
      locaux fragmentés, accords bilatéraux fragiles, interfaces sous-
      spécifiées) demandait un *aggiornamento* explicite — un renouvellement
      délibéré des conventions techniques, contractuelles et de gouvernance,
      pas un énième correctif.

      ## Pourquoi c'est ici

      La salle de Florence est celle où la politique européenne de la donnée
      mobilité se répète avant d'atterrir dans la réglementation. Y porter
      le travail de la Fabrique des Mobilités sur les standards MaaS (CMS,
      OCSS, Mon Compte Mobilité) fait partie de ce à quoi sert le projet
      **MaaS standards**. Cette intervention pose le pourquoi du travail
      catalogué dans l'étude de cas liée.

