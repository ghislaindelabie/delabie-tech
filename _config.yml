# ----------------------------------------------------------
# delabie.tech — production site (Chirpy). Cut over from the v2 preview
# at Phase 8; serves at https://www.delabie.tech.
# ----------------------------------------------------------

theme: jekyll-theme-chirpy

lang: en
timezone: Europe/Paris

title: Ghislain Delabie
tagline: Connecting AI agents to premium, rights-respecting knowledge sources
description: >-
  Personal site of Ghislain Delabie — Head of AI Solutions at Alien
  Intelligence, building the data infrastructure that connects AI agents
  to premium knowledge sources: science, heritage, media.

url: "https://www.delabie.tech"
baseurl: ""

github:
  username: ghislaindelabie

social:
  name: Ghislain Delabie
  # `email:` deliberately omitted — see memory `feedback_email_privacy.md`.
  # Email and phone never appear in any web-served file. Contact lives at
  # /contact/, a hosted-form page where the destination address sits in the
  # service config, not in HTML.
  links:
    - https://github.com/ghislaindelabie
    - https://www.linkedin.com/in/ghislaindelabie

# ---- Appearance ----
theme_mode: # left blank for user toggle
img_cdn: ""
# 224×224 WebP (2× the 112px render size) — the original 512px JPEG cost
# 64 KB for a 112px slot; this is 5.7 KB. Original kept at
# assets/img/ghislain-delabie.jpg for print/CV/social use.
avatar: /assets/img/ghislain-delabie-224.webp

# Open Graph / Twitter social preview image. Chirpy's head.html reads
# `site.social_preview_image` (not jekyll-seo-tag's `site.image`).
# 1200×630 typographic banner on the site palette (UX-5) — head.html
# swaps twitter:card to summary_large_image when this is set.
social_preview_image: /assets/img/og-banner-1200x630.jpg
toc: true

# ---- Comments (OFF in v1 per §9.3.c) ----
comments:
  provider: ""

# ---- Analytics — Phase 5 ----
# GoatCounter — banner-free, GDPR-compliant, free for personal sites.
# Renders nothing when `code` is empty. Set the value (the URL from your
# GoatCounter site, e.g. https://yoursite.goatcounter.com/count) once
# you've created the site at https://www.goatcounter.com. The snippet
# only fires on the production domain, never on preview / localhost.
# See docs/phase-5-refinements.md §1.
analytics:
  goatcounter:
    code: "https://delabie.goatcounter.com/count"

# ---- Pageviews ----
pageviews:
  provider: ""

# ---- Indexing — PRODUCTION (cutover, Phase 8) ----
# Was `true` for the v2 preview to keep it out of search results. Flipped to
# false at cutover so search engines index the production site. The
# metadata-hook only emits the `noindex` meta when this is truthy.
robots_noindex: false

# ---- SEO meta tags — Phase 5 ----
# Google Search Console verification. Paste the `content="..."` value
# from Search Console's HTML-tag verification flow. See
# docs/phase-5-refinements.md §4 for setup steps. Renders nothing
# when blank.
seo:
  google_site_verification: ""

# ---- Paginate ----
paginate: 10

# ---- Pages ----
# Path-scoped defaults address [REVIEW-12 @ 07:01]: Jekyll applies defaults
# in the order they appear; specific path scopes override broader ones.
# Files under fr/ or matching *.fr.md get lang: fr by default, so a future
# contributor who forgets to set `lang:` in a new FR post doesn't silently
# ship it as EN-under-/fr/.
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: false
      toc: true
      lang: en
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/
      lang: en
  # FR overrides
  - scope:
      path: "fr"
      type: posts
    values:
      lang: fr
  - scope:
      path: "**/*.fr.md"
    values:
      lang: fr
  # Activity collection defaults
  - scope:
      path: ""
      type: activity
    values:
      lang: en
  - scope:
      path: "**/*.fr.md"
      type: activity
    values:
      lang: fr
  # Publications collection defaults
  - scope:
      path: ""
      type: publications
    values:
      lang: en
  - scope:
      path: "**/*.fr.md"
      type: publications
    values:
      lang: fr
  # Teaching collection defaults
  - scope:
      path: ""
      type: teaching
    values:
      lang: en
  - scope:
      path: "**/*.fr.md"
      type: teaching
    values:
      lang: fr
  # Case-study collection defaults
  - scope:
      path: ""
      type: case_studies
    values:
      layout: case_study
      lang: en
  - scope:
      path: "**/*.fr.md"
      type: case_studies
    values:
      lang: fr
  # Archive collection defaults (Phase 4b)
  - scope:
      path: ""
      type: archive
    values:
      layout: archive_item
      lang: en
  - scope:
      path: "**/*.fr.md"
      type: archive
    values:
      lang: fr

# ---- Build ----
markdown: kramdown
highlighter: rouge
kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order
  # Phase 2 — case studies (see CHIRPY_MIGRATION_PLAN.md §3.2, §5.3).
  # Renamed from `projects` to `case_studies` to signal the content model
  # shift (professional case studies vs. generic project cards).
  case_studies:
    output: true
    sort_by: date_start
    permalink: /case-studies/:slug/
  # Phase 3 — short-form activity updates surfaced on the homepage's
  # "Recent Activity" section (see plan §3.1, §5.4). One file per update.
  # Not published individually (output: false) — entries are aggregated
  # into the home layout only.
  activity:
    output: false
    sort_by: date
  # Phase 4 — publications: reports, talks, webinars, interviews, papers.
  # (Plan §3.4 / §5.5.) One file per item. Listed on /publications/, not
  # individually routed yet (detail pages optional per-item via has_detail_page).
  publications:
    output: false
    sort_by: date
  # Phase 4 — teaching assignments. (Plan §3.5 / §5.5.) One file per course.
  # Listed on /teaching/; optional detail pages when has_detail_page: true.
  #
  # Sort by scalar `year_end` (last year of engagement). Sorting directly on
  # the `years` array breaks when a future entry uses a scalar or mixed-length
  # array — `[2024,2025] <=> 2025` raises at build time.
  teaching:
    output: false
    sort_by: year_end
  # Phase 4b — archive: third-party traces (press citations, talks where
  # he is invited, podcasts, reports citing him as contributor). Distinct
  # from `_publications/` (vitrine of items he authored). See
  # research/archive_design_options.md Scenario A' and project memory
  # `project_archive_scope.md`. Items render at /archive/:year/:slug/;
  # `detail: false` items render a redirect stub to `original_url`,
  # `detail: true` items render a full layout with body content.
  archive:
    output: true
    sort_by: date
    permalink: /archive/:year/:slug/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - KNOWN_ISSUES.md
  - LICENSE
  - "*.config.js"
  - package*.json
  - node_modules
  - tests
  - scripts
  - playwright-report
  - playwright-results
  - .github
  - .claude
  - CLAUDE.md
  - CHIRPY_MIGRATION_PLAN.md
  - WEBSITE_AUDIT.md
  - docs

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
