  - "https://www.youtube.com/channel/UCNRJeN9T__EEzoa0N_rgkKw"
  - "https://fr.slideshare.net/ghislaindelabie"

# Geographic anchor. Only the city + country, no street address.
home_location:
  city: "Chambéry"
  country: "France"
